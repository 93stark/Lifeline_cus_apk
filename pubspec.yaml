name: lifeline_customer
description: Lifeline Customer app - book trusted local technicians in Purulia.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  geolocator: ^13.0.1

# Newer shared_preferences_android (2.4+) crashes in release builds on some phones
# (NoSuchMethodError ... SharedPreferencesApiRegistrar.getAll). Keep the stable 2.3.x line.
dependency_overrides:
  shared_preferences_android: ">=2.2.0 <2.4.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
